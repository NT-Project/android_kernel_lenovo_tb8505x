name: Pure-Breakdown Auto Build & Release

on:
  push:
    branches:
      - pure-breakdown-v1
      - pure-breakdown-v1-oc
      - pure-breakdown-v1-ksu-umount-oc
    paths-ignore:
      - "README.md"
      - "README.txt"
      - "docs/**"
      - ".github/**"
      - "**/*.md"

  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create GitHub prerelease after a successful manual build"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            file \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libncurses5 \
            libtinfo5 \
            libssl-dev \
            rsync \
            unzip \
            xz-utils \
            zip

      - name: Install Python 2.7
        shell: bash
        run: |
          set -euxo pipefail

          if command -v python2 >/dev/null 2>&1; then
            python2 --version
            exit 0
          fi

          PY2_PREFIX="$HOME/.local/python2"

          if [ ! -x "$PY2_PREFIX/bin/python2.7" ]; then
            curl -fsSL \
              https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz \
              -o /tmp/Python-2.7.18.tgz

            tar -xzf /tmp/Python-2.7.18.tgz -C /tmp

            pushd /tmp/Python-2.7.18
            ./configure \
              --prefix="$PY2_PREFIX" \
              --without-ensurepip
            make -j2
            make install
            popd
          fi

          ln -sf "$PY2_PREFIX/bin/python2.7" "$PY2_PREFIX/bin/python2"
          echo "$PY2_PREFIX/bin" >> "$GITHUB_PATH"

          "$PY2_PREFIX/bin/python2" --version

      - name: Select build variant
        id: variant
        shell: bash
        run: |
          set -euxo pipefail

          case "${GITHUB_REF_NAME}" in
            pure-breakdown-v1)
              VARIANT="stock"
              RELEASE_NAME="Pure-Breakdown v1 Auto"
              LOCAL_VERSION=""
              KERNEL_STRING="Pure-Breakdown v1 | TB-8505X | Linux 4.9.200"
              BANNER_NAME="Pure-Breakdown Kernel v1"
              FOOTER_NAME="Pure-Breakdown v1"
              ;;

            pure-breakdown-v1-oc)
              VARIANT="oc"
              RELEASE_NAME="Pure-Breakdown v1 OC Auto"
              LOCAL_VERSION=""
              KERNEL_STRING="Pure-Breakdown v1 OC | TB-8505X | 2.201GHz/730MHz"
              BANNER_NAME="Pure-Breakdown Kernel v1 OC"
              FOOTER_NAME="Pure-Breakdown v1 OC"
              ;;

            pure-breakdown-v1-ksu-umount-oc)
              VARIANT="ksu-umount-oc"
              RELEASE_NAME="Pure-Breakdown v1 KSU_umount_OC Auto"
              LOCAL_VERSION="-KSU_umount_OC"
              KERNEL_STRING="Pure-Breakdown v1 KSU_umount_OC | TB-8505X"
              BANNER_NAME="Pure-Breakdown v1 KSU+Umount+OC"
              FOOTER_NAME="Pure-Breakdown KSU+Umount+OC"
              ;;

            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

          SHORT_SHA="${GITHUB_SHA::8}"
          BUILD_TIME="$(date -u +'%Y%m%d-%H%M%S')"
          TAG="auto-${VARIANT}-${BUILD_TIME}-${SHORT_SHA}"

          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "local_version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel_string=$KERNEL_STRING" >> "$GITHUB_OUTPUT"
          echo "banner_name=$BANNER_NAME" >> "$GITHUB_OUTPUT"
          echo "footer_name=$FOOTER_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare legacy AOSP Clang host environment
        shell: bash
        run: |
          set -euxo pipefail

          sudo sysctl -w vm.mmap_rnd_bits=28

          GCC_BIN="$PWD/prebuilds/toolchain/aarch64-linux-android-4.9/bin"

          ln -sf aarch64-linux-android-as "$GCC_BIN/as"
          ln -sf aarch64-linux-android-ld "$GCC_BIN/ld"

          echo "=== Host tools ==="
          command -v gcc
          command -v as
          command -v ld
          as --version | head -n 1

          echo "=== Cross tools ==="
          "$GCC_BIN/aarch64-linux-android-as" --version | head -n 1
          "$GCC_BIN/aarch64-linux-android-ld" --version | head -n 1

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          CLANG="$PWD/prebuilds/toolchain/clang-r353983c/bin/clang"
          GCC_ROOT="$PWD/prebuilds/toolchain/aarch64-linux-android-4.9"
          GCC_BIN="$GCC_ROOT/bin"
          GCC="$GCC_BIN/aarch64-linux-android-gcc"

          test -x "$CLANG"
          test -x "$GCC"
          test -x "$GCC_BIN/aarch64-linux-android-as"
          test -x "$GCC_BIN/aarch64-linux-android-ld"

          "$CLANG" --version
          "$GCC" --version

          echo "=== stack protector compiler smoke test ==="
          cat > /tmp/cc-smoke.c <<'EOC'
          int test_stack_protector(int x)
          {
              char buf[32];
              buf[0] = (char)x;
              return buf[0];
          }
          EOC

          "$CLANG" \
            --target=aarch64-linux-gnu \
            --prefix="$GCC_BIN/" \
            --gcc-toolchain="$GCC_ROOT" \
            -no-integrated-as \
            -fstack-protector-strong \
            -c /tmp/cc-smoke.c \
            -o /tmp/cc-smoke.o \
            -v

          file /tmp/cc-smoke.o

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$PWD/prebuilds/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="$PWD/prebuilds/toolchain/clang-r353983c/bin/clang"

          make \
            O=out \
            ARCH=arm64 \
            akita_row_call_defconfig

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$PWD/prebuilds/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="$PWD/prebuilds/toolchain/clang-r353983c/bin/clang"

          echo "CPU cores: $(nproc)"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LOCALVERSION="${{ steps.variant.outputs.local_version }}" \
            python=python2 \
            EXTRA_CFLAGS="-Wno-error -Wno-error=strict-prototypes"

      - name: Validate build output
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          test -s "$IMAGE"
          file "$IMAGE"
          sha256sum "$IMAGE"

          echo
          echo "Kernel release:"
          make -s \
            O=out \
            ARCH=arm64 \
            kernelrelease

      - name: Package AnyKernel3 flashable ZIP
        id: package
        shell: bash
        env:
          KERNEL_STRING: ${{ steps.variant.outputs.kernel_string }}
          BANNER_NAME: ${{ steps.variant.outputs.banner_name }}
          FOOTER_NAME: ${{ steps.variant.outputs.footer_name }}
        run: |
          set -euxo pipefail

          mkdir -p dist

          BASE="Pure-Breakdown-TB8505X-${{ steps.variant.outputs.variant }}-${{ steps.variant.outputs.short_sha }}"
          AK_DIR="$RUNNER_TEMP/AnyKernel3-TB8505X"

          cp out/arch/arm64/boot/Image.gz-dtb "dist/${BASE}-Image.gz-dtb"
          cp out/.config "dist/${BASE}.config"

          git clone \
            --depth 1 \
            https://github.com/kin203/AnyKernel3-TB8505X.git \
            "$AK_DIR"

          AK_COMMIT="$(git -C "$AK_DIR" rev-parse HEAD)"
          echo "AnyKernel3 template commit: $AK_COMMIT"

          rm -rf "$AK_DIR/.git"
          cp out/arch/arm64/boot/Image.gz-dtb "$AK_DIR/Image.gz-dtb"

          export AK_DIR

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["AK_DIR"]) / "anykernel.sh"
          text = path.read_text(encoding="utf-8")

          text, n = re.subn(
              r"^kernel\.string=.*$",
              "kernel.string=" + os.environ["KERNEL_STRING"],
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("kernel.string not found exactly once")

          old_banner = 'ui_print "   Pure-Breakdown Kernel v1"'
          new_banner = 'ui_print "   ' + os.environ["BANNER_NAME"] + '"'
          if old_banner not in text:
              raise SystemExit("top Pure-Breakdown banner line not found")
          text = text.replace(old_banner, new_banner, 1)

          old_footer = 'ui_print "   Pure-Breakdown v1"'
          new_footer = 'ui_print "   ' + os.environ["FOOTER_NAME"] + '"'
          if old_footer not in text:
              raise SystemExit("footer Pure-Breakdown line not found")
          text = text.replace(old_footer, new_footer, 1)

          path.write_text(text, encoding="utf-8")
          PY

          echo "=== AnyKernel variant ==="
          grep -E 'kernel.string=|Pure-Breakdown' "$AK_DIR/anykernel.sh"

          (
            cd "$AK_DIR"
            zip -r9 \
              "$GITHUB_WORKSPACE/dist/${BASE}.zip" \
              . \
              -x "*.git*" \
              -x "*.zip"
          )

          test -s "dist/${BASE}.zip"

          (
            cd dist
            sha256sum \
              "${BASE}.zip" \
              "${BASE}-Image.gz-dtb" \
              "${BASE}.config" \
              > "${BASE}.sha256"
          )

          unzip -l "dist/${BASE}.zip" | grep -E 'anykernel\.sh|Image\.gz-dtb'
          unzip -p "dist/${BASE}.zip" anykernel.sh | grep 'kernel.string='

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "zip=${BASE}.zip" >> "$GITHUB_OUTPUT"
          echo "anykernel_commit=$AK_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail

          VARIANT="${{ steps.variant.outputs.variant }}"
          CURRENT_TAG="${{ steps.variant.outputs.tag }}"
          LAST_TAG=""

          while IFS= read -r TAG; do
            if git merge-base --is-ancestor "$TAG" HEAD 2>/dev/null; then
              LAST_TAG="$TAG"
              break
            fi
          done < <(
            git tag \
              --list "auto-${VARIANT}-*" \
              --sort=-creatordate
          )

          {
            echo "# ${{ steps.variant.outputs.release_name }}"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Kernel commit: \`${GITHUB_SHA}\`"
            echo "- AnyKernel3 commit: \`${{ steps.package.outputs.anykernel_commit }}\`"
            echo "- Auto tag: \`${CURRENT_TAG}\`"
            echo "- Device: Lenovo Tab M8 TB-8505X"
            echo "- Kernel base: Linux 4.9.200"
            echo

            echo "## Changes"
            echo

            if [ -n "$LAST_TAG" ]; then
              echo "Changes since \`$LAST_TAG\`:"
              echo
              git log \
                --no-merges \
                --pretty=format:'- %s (`%h`) — %an' \
                "${LAST_TAG}..HEAD"
            else
              echo "No previous auto-release tag found. Recent commits:"
              echo
              git log \
                --no-merges \
                -n 20 \
                --pretty=format:'- %s (`%h`) — %an'
            fi

            echo
            echo
            echo "## Files"
            echo
            echo "- \`${{ steps.package.outputs.zip }}\` — flashable AnyKernel3 ZIP"
            echo "- \`${{ steps.package.outputs.base }}-Image.gz-dtb\` — raw kernel image"
            echo "- \`${{ steps.package.outputs.base }}.config\` — build config"
            echo "- \`${{ steps.package.outputs.base }}.sha256\` — checksums"
            echo
            echo "> Auto-generated CI build. Keep a known-good stock boot image and working recovery before flashing."
          } > release-notes.md

          cat release-notes.md

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pure-Breakdown-${{ steps.variant.outputs.variant }}-${{ steps.variant.outputs.short_sha }}
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Create auto tag and GitHub prerelease
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          gh release create \
            "${{ steps.variant.outputs.tag }}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.variant.outputs.release_name }} | ${{ steps.variant.outputs.short_sha }}" \
            --notes-file release-notes.md \
            --prerelease
